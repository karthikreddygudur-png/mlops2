seed: 42
image_size: 224
class_names: ["cat", "dog"]

data:
  raw_dir: data/raw
  processed_dir: data/processed
  subset_per_class: 2500
  splits:
    train: 0.8
    val: 0.1
    test: 0.1

train:
  epochs: 5
  batch_size: 32
  learning_rate: 0.001
  num_workers: 0
  model_out: models/model.pt

mlflow:
  tracking_uri: file:./mlruns
  experiment_name: cats-vs-dogs
